<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}OhMyPT{% endblock %}</title>
<!-- Pretendard via CDN (documented decision): server-rendered online-only tool for a
     handful of users; the page already depends on external origins (Telegram widget),
     and the app has no static-file mount to self-host from. Revisit at Phase C. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Terminal wayfinding palette */
  --yellow:#FFC900;--yellow-deep:#E9B800;--yellow-ink:#665000;
  --panel:#0E0E0D;--panel2:#242422;--panel-line:#3A3A37;
  --bg:#EDEDE9;--card:#FFFFFF;--card2:#F4F4F0;
  --text:#151513;--text2:#5D5D57;--on-panel:#FFFFFF;--on-panel2:#B8B8B0;
  --green:#0E7A3C;--orange:#9A6B00;--red:#C42B1C;
  --border:#D9D9D2;
  /* legacy alias */
  --accent:#151513;--accent2:#151513;
}
html{font-size:16px}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;font-feature-settings:"tnum"}
a{color:var(--text);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--yellow);color:var(--panel)}

/* ── Pictogram system ─────────────────────────── */
.pic{width:1em;height:1em;display:inline-block;vertical-align:-0.12em;fill:currentColor;flex-shrink:0}
.picto{width:38px;height:38px;border-radius:7px;background:var(--panel);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.picto .pic{width:22px;height:22px}
.picto.on-yellow{background:var(--panel);color:var(--yellow)}

/* ── Navigation: overhead black board ─────────── */
nav{background:var(--panel);color:var(--on-panel);padding:0 20px;display:flex;align-items:stretch;gap:2px;position:sticky;top:0;z-index:100;flex-wrap:wrap;min-height:56px}
nav .logo{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:800;letter-spacing:-.01em;color:#fff;margin-right:18px}
nav .logo .mark{width:32px;height:32px;border-radius:6px;background:var(--yellow);color:var(--panel);display:inline-flex;align-items:center;justify-content:center}
nav .logo .mark .pic{width:20px;height:20px}
nav a.navlink{display:flex;align-items:center;padding:0 14px;color:var(--on-panel2);font-size:.95rem;font-weight:600}
nav a.navlink:hover{color:#fff;text-decoration:none}
nav a.navlink.active{background:var(--yellow);color:var(--panel);font-weight:800}
nav .spacer{flex:1}
nav .user-info{display:flex;align-items:center;gap:12px;font-size:.88rem;color:var(--on-panel2)}
nav .user-info .name{color:#fff;font-weight:600}
nav .user-info a{color:var(--on-panel2)}

.container{max-width:1020px;margin:0 auto;padding:28px 16px 64px}

/* ── Sign band: yellow wayfinding panel ───────── */
.signband{background:var(--yellow);color:var(--panel);border-radius:10px;padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:14px}
.signband .arrow{margin-left:auto;flex-shrink:0}
.signband .arrow .pic{width:34px;height:34px}
a.signband:hover{text-decoration:none;background:var(--yellow-deep)}
a.signband:hover .arrow{transform:translateX(4px)}
.signband .arrow{transition:transform .25s cubic-bezier(.16,1,.3,1)}
.signband .sub{color:var(--yellow-ink);font-size:.85rem;font-weight:600}

/* ── Black data board ─────────────────────────── */
.board{background:var(--panel);color:var(--on-panel);border-radius:10px;padding:0;margin-bottom:14px;overflow:hidden}
.board .board-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.board .cell{padding:16px 18px;border-left:1px solid var(--panel-line)}
.board .cell:first-child{border-left:none}
.board .label{font-size:.78rem;font-weight:600;color:var(--on-panel2);margin-bottom:2px}
.board .val{font-size:1.5rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.board .val .unit{font-size:.7rem;font-weight:600;color:var(--on-panel2);margin-left:2px}
.gate{font-size:clamp(2.2rem,6vw,4.6rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}

/* ── White content board ──────────────────────── */
.sheet{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px}
.sheet .inset{background:var(--card2);border-radius:7px;padding:12px 14px}

/* headings */
h1{font-size:1.55rem;font-weight:800;letter-spacing:-.015em;margin:0 0 18px}
h2{font-size:1.08rem;font-weight:800;letter-spacing:-.01em;margin:30px 0 10px;display:flex;align-items:center;gap:8px}
h2 .more{margin-left:auto;font-size:.8rem;color:var(--text2);font-weight:600}
h2:first-of-type{margin-top:0}

/* ── Legacy component restyle (shared pages) ──── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:26px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.stat-card .label{font-size:.8rem;font-weight:600;color:var(--text2);margin-bottom:2px}
.stat-card .value{font-size:1.7rem;font-weight:800;letter-spacing:-.01em;color:var(--text)}
.record-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;transition:background .15s}
.record-card:hover{background:var(--card2)}
.record-card .meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.record-card .date{color:var(--text2);font-size:.86rem;font-weight:600}
.record-card .user{color:var(--text);font-size:.86rem;font-weight:600}
.kcal{font-weight:700;padding:2px 10px;border-radius:5px;font-size:.8rem;display:inline-block}
.kcal-low{background:#0E7A3C14;color:var(--green)}
.kcal-mid{background:#9A6B0014;color:var(--orange)}
.kcal-high{background:#C42B1C12;color:var(--red)}
.content-box{background:var(--card2);border-radius:7px;padding:14px 16px;margin-top:10px;font-size:.93rem;line-height:1.7}
.content-box b,.content-box strong{color:var(--text)}
.content-box ul,.content-box ol{padding-left:20px;margin:8px 0}
.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-bar input{background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:7px;font-size:.9rem;font-family:inherit}
.filter-bar input:focus{outline:2px solid var(--panel);outline-offset:-1px}
.filter-bar button{background:var(--panel);color:#fff;border:none;padding:9px 20px;border-radius:7px;cursor:pointer;font-size:.9rem;font-weight:700;font-family:inherit}
.filter-bar button:hover{background:var(--panel2)}
.pagination{display:flex;gap:8px;justify-content:center;margin-top:24px}
.pagination a,.pagination span{padding:6px 14px;border-radius:7px;background:var(--card);border:1px solid var(--border);font-size:.9rem;font-weight:600}
.pagination .active{background:var(--panel);border-color:var(--panel);color:#fff}
.bar-chart{margin:16px 0}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-label{width:80px;font-size:.78rem;font-weight:600;color:var(--text2);text-align:right;flex-shrink:0}
.bar{height:22px;border-radius:4px;background:var(--panel2);min-width:2px}
.bar-val{font-size:.78rem;color:var(--text2);margin-left:4px}
.empty{text-align:center;color:var(--text2);padding:40px;font-size:1rem}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:700;background:var(--yellow);color:var(--panel);margin-left:6px}

/* progress track */
.track{background:var(--card2);border-radius:4px;height:8px;overflow:hidden}
.board .track{background:var(--panel2)}
.track .fill{height:100%;background:var(--panel)}
.track .fill.ok{background:var(--green)}
.track .fill.bad{background:var(--red)}
.board .track .fill{background:var(--yellow)}

/* data tables */
table.rows{width:100%;border-collapse:collapse;font-size:.86rem}
table.rows th{font-weight:600;color:var(--text2);padding:7px 9px;text-align:right}
table.rows th:first-child,table.rows td:first-child{text-align:left}
table.rows td{padding:7px 9px;border-top:1px solid var(--border);text-align:right}

/* entrance: sign bands settle once */
@media (prefers-reduced-motion:no-preference){
  .settle{animation:settle .5s cubic-bezier(.16,1,.3,1) both}
  .settle:nth-child(2){animation-delay:.06s}
  .settle:nth-child(3){animation-delay:.12s}
  @keyframes settle{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
}

@media(max-width:640px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .stat-card .value{font-size:1.35rem}
  nav{padding:0 10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  nav.can-scroll-right{mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
  nav::-webkit-scrollbar{display:none}
  nav .logo{margin-right:6px}
  nav a.navlink{padding:0 10px;font-size:.88rem;white-space:nowrap}
  nav .user-info .name{display:none}
  .signband{flex-wrap:wrap;gap:10px}
  .signband .arrow{margin-left:auto}
  .gate{font-size:clamp(1.9rem,9vw,2.6rem);white-space:nowrap}
  .board .board-row{grid-auto-flow:row;grid-auto-columns:unset;grid-template-columns:1fr 1fr}
  .board .cell{border-left:none;border-top:1px solid var(--panel-line)}
  .board .cell:nth-child(-n+2){border-top:none}
  .board .cell:nth-child(even){border-left:1px solid var(--panel-line)}
}
</style>
</head>
<body>
<!--
THESIS: 개인 피트니스 기록을 공항 웨이파인딩 사인 시스템으로 안내한다 — 목표는 게이트, 오늘 할 일은 다음 결정 지점. 다크 네온 피트니스 대시보드 문법을 거부한다.
OWN-WORLD: 스키폴 옐로(#FFC900) 안내 밴드 + 제트블랙 데이터 보드 + 콘크리트 그라운드(#EDEDE9), Pretendard 휴머니스트 산세리프, 흑백 인셋 픽토그램, 모서리 고정 화살표, 기념비 스케일 타뷸러 숫자. 옐로는 목표 안내에만 쓴다.
STORY: 접속 즉시 주 목표까지의 거리(게이트 표지판)와 오늘의 다음 결정(남은 섭취·단백질)을 읽고, 기록·추이 보드를 따라 이동한다.
FIRST VIEWPORT: 상단 옐로 주 목표 사인밴드(지표 현재→목표, D-숫자 기념비 스케일, 우측 화살표), 바로 아래 블랙 오늘-결정 보드(남은 kcal 게이트 스케일), 이어 섭취·매크로 시트.
FORM: 터미널 옐로 웨이파인딩 — 챌린저 채택(내 그라운디드 7위 배정을 유저가 교체). seed key 7d2b41e4.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M13.2 4.2 20 11v2l-6.8 6.8-2.1-2.1 3.9-3.9H4v-3.6h11l-3.9-3.9z"/></symbol>
<symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M10.8 4.2 4 11v2l6.8 6.8 2.1-2.1-3.9-3.9H20v-3.6H9l3.9-3.9z"/></symbol>
<symbol id="i-barbell" viewBox="0 0 24 24"><path d="M3 9h2v6H3zm16 0h2v6h-2zM6.5 7h2.3v10H6.5zm8.7 0h2.3v10h-2.3zM9.8 10.5h4.4v3H9.8z"/></symbol>
<symbol id="i-meal" viewBox="0 0 24 24"><path d="M7 2h1.8v7.2c0 1.2-.8 2.1-1.9 2.4V22H5.1V11.6c-1.1-.3-1.9-1.2-1.9-2.4V2H5v7h.9V2H7v7h.9zm7.5 0c2.5 0 4.3 2 4.3 5.2 0 2.6-1.2 4.4-3 4.9V22h-1.9V12.1c-1.8-.5-3-2.3-3-4.9 0-3.2 1.8-5.2 3.6-5.2z"/></symbol>
<symbol id="i-scale" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm7 2a5.5 5.5 0 0 0-5.5 5.5h3.2c0-1.3 1-2.3 2.3-2.3s2.3 1 2.3 2.3h3.2A5.5 5.5 0 0 0 12 5zm-1.1 12h2.2l.7-4.2h-3.6z"/></symbol>
<symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2s1.2 2.7 1.2 4.8c0 1.5-.9 2.6-2.1 2.6S9 8.3 9 6.8c0-.5.1-1 .2-1.4C6.7 7.2 5 10 5 13a7 7 0 0 0 14 0c0-5-4.2-8.5-7-11zm0 17.5A3.5 3.5 0 0 1 8.5 16c0-1.7 1.3-3.1 2.4-4.3.6 1 3.6 2.3 3.6 4.3 0 1.9-1.1 3.5-2.5 3.5z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><path d="M7 2h2v3H7zm8 0h2v3h-2zM4 4h1v3h4V4h6v3h4V4h1a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm1 6v9h14v-9zm2 2h3v3H7z"/></symbol>
<symbol id="i-walk" viewBox="0 0 24 24"><path d="M13.5 2.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM9.6 8.2l2.8-1.4c.7-.3 1.5-.1 1.9.5l1.5 2.2 3 1.4-.8 1.7-3.5-1.6-1-1.5-.9 3.6 2.6 2.5 1 5.4-1.9.4-.9-4.8-2.8-2.7-1 4.2-3.4 3.1-1.3-1.4 3-2.8 1.6-7.2-1.4.7-.7 3.1-1.8-.4.9-4.2z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M9.5 16.2 5.3 12l-1.8 1.8 6 6 12-12L19.7 6z"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 2 1 21h22zm-1.2 7h2.4v6h-2.4zm0 7.5h2.4V19h-2.4z"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zm0 3.2a5.8 5.8 0 1 0 0 11.6 5.8 5.8 0 0 0 0-11.6zm0 3.3a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><path d="M12 3a4.2 4.2 0 1 1 0 8.4A4.2 4.2 0 0 1 12 3zm0 10c4.6 0 8 2.2 8 5.5V21H4v-2.5C4 15.2 7.4 13 12 13z"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3h2v16h16v2H3zm15 2h3l-7.2 8.4-4-3.4L6 14.2 4.6 12.8l5.4-5.2 4 3.4z"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5.2-7 13-7 13S5 14.2 5 9a7 7 0 0 1 7-7zm0 4.2A2.8 2.8 0 1 0 12 11.8 2.8 2.8 0 0 0 12 6.2z"/></symbol>
</defs>
</svg>
<nav>
<a class="logo" href="/"><span class="mark"><svg class="pic"><use href="#i-barbell"/></svg></span>OhMyPT</a>
<a class="navlink" href="/">대시보드</a>
<a class="navlink" href="/goals">목표</a>
<a class="navlink" href="/inbody">인바디</a>
<a class="navlink" href="/meals">식단</a>
<a class="navlink" href="/records">운동 기록</a>
{% if user and user.is_trainer %}
<a class="navlink" href="/trainer">트레이너</a>
{% endif %}
<span class="spacer"></span>
{% if user %}
<div class="user-info">
  <span class="name">{{ user.first_name or user.username or user.user_id }}</span>
  {% if user.is_trainer %}<span class="badge">트레이너</span>{% endif %}
  <a href="/logout">로그아웃</a>
</div>
{% endif %}
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
<script>
(function(){
  var p = location.pathname;
  document.querySelectorAll('nav a.navlink').forEach(function(a){
    var h = a.getAttribute('href');
    if (h === '/' ? p === '/' : p.startsWith(h)) a.classList.add('active');
  });
  var nav = document.querySelector('nav');
  function updateFade(){
    var more = nav.scrollWidth - nav.clientWidth - nav.scrollLeft > 4;
    nav.classList.toggle('can-scroll-right', more);
  }
  nav.addEventListener('scroll', updateFade, {passive:true});
  window.addEventListener('resize', updateFade);
  updateFade();
})();
</script>
</body>
</html>

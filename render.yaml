services:
  - type: web
    name: workout-analyzer-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEB_PORT
        value: "10000"
      - key: MAIN_MODEL
        value: "gpt-5-mini"
      - key: VISION_MODEL
        value: "gpt-5-mini"
      - key: CLASSIFIER_MODEL
        value: "gpt-5-nano"
      - key: FALLBACK_MODEL
        value: "gpt-5.6-luna"
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
